<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Industrial Octagonal Frame -->
  <polygon points="30,6 70,6 94,30 94,70 70,94 30,94 6,70 6,30" 
           fill="#121214" 
           stroke="#27272A" 
           stroke-width="2.5" />
  
  <!-- Outer Corner Crosshairs -->
  <line x1="16" y1="30" x2="24" y2="30" stroke="#3F3F46" stroke-width="1.5" />
  <line x1="20" y1="26" x2="20" y2="34" stroke="#3F3F46" stroke-width="1.5" />
  <line x1="76" y1="30" x2="84" y2="30" stroke="#3F3F46" stroke-width="1.5" />
  <line x1="80" y1="26" x2="80" y2="34" stroke="#3F3F46" stroke-width="1.5" />

  <!-- Tower Pylon Base Structure -->
  <path d="M 28 82 L 42 46 L 58 46 L 72 82" 
        stroke="#71717A" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <!-- Pylon Cross Bracing -->
  <line x1="34" y1="68" x2="66" y2="68" stroke="#3F3F46" stroke-width="2" />
  <line x1="39" y1="55" x2="61" y2="55" stroke="#3F3F46" stroke-width="2" />
  <line x1="35" y1="68" x2="61" y2="55" stroke="#27272A" stroke-width="1.5" />
  <line x1="65" y1="68" x2="39" y2="55" stroke="#27272A" stroke-width="1.5" />

  <!-- Control Tower Observation Deck (Chamfered Hex) -->
  <polygon points="36,46 64,46 70,34 30,34" 
           fill="#1A1A1E" 
           stroke="#FF5F15" 
           stroke-width="2" />
  
  <!-- Command Windows Slits -->
  <line x1="36" y1="40" x2="64" y2="40" stroke="#FF5F15" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- Radome / Autonomous Antenna Mast -->
  <line x1="50" y1="34" x2="50" y2="18" stroke="#FAFAFA" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Transmitter Beacon -->
  <circle cx="50" cy="18" r="4" fill="#FF5F15" />
  <circle cx="50" cy="18" r="7" stroke="#FF5F15" stroke-width="1" stroke-dasharray="2 2" opacity="0.8" />
  
  <!-- Radar Sweep Horizon Arc -->
  <path d="M 36 22 A 16 16 0 0 1 64 22" stroke="#FF5F15" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.9" />
  <path d="M 28 26 A 26 26 0 0 1 72 26" stroke="#FF5F15" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 3" fill="none" opacity="0.5" />
</svg>
